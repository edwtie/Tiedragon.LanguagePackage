# Tiedragon Language Package policy
# This file controls which package files are accepted by ToolEditor and the
# command-line package compiler. Keep it strict: unknown files must fail.

[package]
manifest=manifest.json
allowedExtensions=.bmp,.css,.gif,.html,.jpg,.jpeg,.js,.json,.lng,.png,.svg,.webp
blockedExtensions=.bat,.cmd,.com,.dll,.exe,.msi,.ps1,.scr,.vbs
imageExtensions=.bmp,.gif,.jpg,.jpeg,.png,.svg,.webp
textExtensions=.css,.html,.js
allowedScripts=basis.js,formula.js,main-help.js,nod.js,nod-popup.js

# Prefix format:
#   package/path/:kind
# Kinds:
#   image  = imageExtensions only
#   lng    = .lng only
#   text   = textExtensions only
allowedPrefixes=language/:lng;assets/:image;manual/:text;help/content/main/:text;help/main/:text;help/content/nod/:text;help/nod/:text;nod/:text;help/content/legal/:text;help/legal/:text;help/content/tool-editor/:text;help/tool-editor/:text;tool-editor/:text;help/content/HelpApi/:text;source/templates/:text;templates/:text;formula/:text

# Root help files are allowed directly below help/. They are shared templates,
# CSS and trusted JavaScript used by the internal help renderer.
allowedRootHelpFiles=basis.js,document-body.html,document-topic.html,formula-card.html,formula-film.css,formula-film.html,formula-film.js,formula.js,main-help.css,main-help.js,nod-popup.css,nod-popup.js,nod.js
